name: Publish to ComfyUI Registry
on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install comfy-cli
      - run: comfy node publish --token ${{ secrets.REGISTRY_ACCESS_TOKEN }}
